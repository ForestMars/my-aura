name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        env:
          NITRO_PRESET: github-pages
        run: bun run build

      - name: Ensure static HTML entrypoint
        run: |
          touch .output/public/.nojekyll

          if [ -f ".output/public/index.html" ]; then
            echo "Nitro successfully built index.html."
          else
            echo "Generating pre-rendered root HTML from Nitro server output..."
            # Run the compiled Nitro server in the background to render the root path
            bun .output/server/index.mjs &
            SERVER_PID=$!
            
            # Wait for server startup
            sleep 2
            
            # Fetch rendered HTML from the local SSR server
            curl -s http://localhost:3000/ > .output/public/index.html || true
            
            # Stop the background server
            kill $SERVER_PID || true

            # Fallback check
            if [ ! -s ".output/public/index.html" ]; then
              echo "ERROR: Failed to capture pre-rendered HTML from local SSR server."
              exit 1
            fi
          fi

          # Copy root HTML to 404.html for GitHub Pages client-side route fallback
          cp .output/public/index.html .output/public/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './.output/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
