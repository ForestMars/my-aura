name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Find index.html location
        id: locate-artifact
        run: |
          echo "=== Searching for index.html inside .output ==="
          INDEX_PATH=$(find .output -name "index.html" | head -n 1)
          
          if [ -n "$INDEX_PATH" ]; then
            TARGET_DIR=$(dirname "$INDEX_PATH")
            echo "Found index.html in: $TARGET_DIR"
            echo "path=$TARGET_DIR" >> $GITHUB_OUTPUT
          else
            echo "ERROR: index.html was not found anywhere inside .output!"
            find .output
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.locate-artifact.outputs.path }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
