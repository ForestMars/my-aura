name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Generate SPA index.html for GitHub Pages
        run: |
          echo "Building static entrypoint from compiled assets..."
          
          JS_FILE=$(basename $(ls .output/public/assets/index-*.js | head -n 1))
          CSS_FILE=$(basename $(ls .output/public/assets/styles-*.css | head -n 1))
          ROUTES_FILE=$(basename $(ls .output/public/assets/routes-*.js 2>/dev/null | head -n 1 || true))

          ROUTES_SCRIPT=""
          if [ -n "$ROUTES_FILE" ]; then
            ROUTES_SCRIPT="<script type=\"module\" src=\"./assets/${ROUTES_FILE}\"></script>"
          fi

          cat <<EOF > .output/public/index.html
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>App</title>
              <link rel="stylesheet" href="./assets/${CSS_FILE}" />
            </head>
            <body>
              <div id="app"></div>
              ${ROUTES_SCRIPT}
              <script type="module" src="./assets/${JS_FILE}"></script>
            </body>
          </html>
          EOF

          # Enable client routing on refresh & prevent Jekyll build ignoring asset folders
          cp .output/public/index.html .output/public/404.html
          touch .output/public/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './.output/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
