name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Prerender static index.html from server bundle
        run: |
          touch .output/public/.nojekyll

          # Execute the built Nitro server locally using Bun
          bun .output/server/index.mjs &
          SERVER_PID=$!

          # Wait for local server spin-up
          sleep 3

          # Scrap the rendered root page directly from the SSR engine
          curl -s http://localhost:3000/ > .output/public/index.html || curl -s http://127.0.0.1:3000/ > .output/public/index.html

          # Kill local server process
          kill $SERVER_PID || true

          if [ ! -s ".output/public/index.html" ]; then
            echo "ERROR: Could not capture HTML from local SSR server."
            exit 1
          fi

          echo "Successfully captured SSR HTML:"
          head -n 20 .output/public/index.html

          # Set up 404 fallback for SPA routing on GitHub Pages
          cp .output/public/index.html .output/public/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './.output/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
